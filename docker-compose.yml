services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - claria_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d claria"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/claria
      API_KEY: ${API_KEY:-demo-claria-key}
      CORS_ORIGINS: http://localhost:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed_demo && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      CLARIA_API_URL: http://api:8000
      CLARIA_API_KEY: ${API_KEY:-demo-claria-key}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  claria_pgdata:
